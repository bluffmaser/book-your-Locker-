<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Locker Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <!-- Google Maps Extended Component Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.11/index.min.js"></script>
  <gmpx-api-loader key="AIzaSyBtbFB96tt_IG5bQAxDi4iqpRzLcsi8Na8" solution-channel="GMP_GE_mapsandplacesautocomplete_v2"></gmpx-api-loader>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Pacifico', cursive;
      overflow: hidden;
      touch-action: none;
      background: #fdfdfd;
    }

    section {
      display: none;
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
    }

    section.active {
      display: block;
      z-index: 10;
    }

    .splash-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fff200;
      transition: background-color 1s ease-in-out;
      text-align: center;
    }

    .splash-screen h1 {
      font-size: 4em;
      color: #000;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
      text-transform: uppercase;
      margin: 0;
    }

    gmp-map {
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .place-picker-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: 90%;
      max-width: 500px;
      padding: 10px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      animation: fadeSlideIn 1s ease-out;
    }

    gmpx-place-picker {
      width: 100%;
      font-size: 1.1em;
      transition: all 0.3s ease-in-out;
    }

    gmpx-place-picker:focus-within {
      box-shadow: 0 0 10px #00000044;
      transform: scale(1.02);
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .info-box {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: #f8f8f8;
      padding: 20px;
      z-index: 2;
    }

    .info-box label {
      font-weight: bold;
    }

    select, button {
      padding: 10px;
      margin-top: 10px;
      display: block;
      width: 100%;
      font-size: 1em;
    }

    button {
      padding: 12px;
      margin-top: 20px;
      width: 100%;
      font-size: 1.1em;
      font-weight: bold;
      background-color: #000;
      color: #fff200;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #333;
      transform: scale(1.03);
    }

    /* Confirmation Section */
    #confirmation-section {
      background: #2ecc71;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #confirmation-section h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    #confirmation-section p, #otp, #timer {
      font-size: 1.2em;
      margin: 5px 0;
    }

    #otp {
      font-size: 2em;
      font-weight: bold;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <section id="splash" class="splash-screen active">
    <h1>Online Locker Booking</h1>
  </section>

  <!-- Booking Section -->
  <section id="booking-section">
    <gmp-map center="40.749933,-73.98633" zoom="13" map-id="DEMO_MAP_ID">
      <div class="place-picker-container">
        <gmpx-place-picker placeholder="Enter Pickup or Drop Location"></gmpx-place-picker>
      </div>
      <gmp-advanced-marker></gmp-advanced-marker>
    </gmp-map>

    <div class="info-box">
      <p id="loc"></p>
      <label for="hours">Select Duration (Hours):</label>
      <select id="hours">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>More than 6 hours</option>
      </select>
      <p id="costDisplay"><strong>Cost:</strong> ₹0</p>
      <button onclick="confirmBooking()">CONFIRM BOOKING</button>
    </div>
  </section>

  <!-- Confirmation Section -->
  <section id="confirmation-section">
    <h1>BOOKING CONFIRMED ✅</h1>
    <p id="summary"></p>
    <p id="amount"></p>
    <p>YOUR OTP:</p>
    <div id="otp"></div>
    <p>Be ready luggage will pick in: <span id="timer">10:00</span></p>
  </section>

  <script>
    const splash = document.getElementById("splash");
    const bookingSection = document.getElementById("booking-section");
    const confirmationSection = document.getElementById("confirmation-section");

    function showSection(idToShow) {
      document.querySelectorAll("section").forEach(sec => sec.classList.remove("active"));
      document.getElementById(idToShow).classList.add("active");
    }

    // Splash screen transition
    setTimeout(() => splash.style.backgroundColor = "#fff", 1200);
    setTimeout(() => showSection("booking-section"), 2500);

    let selectedLocation = null;

    function calculateCost(hours) {
      return hours === "More than 6 hours" ? 300 : parseInt(hours) * 50;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById("hours").addEventListener("change", (e) => {
        const cost = calculateCost(e.target.value);
        document.getElementById("costDisplay").innerHTML = `<strong>Cost:</strong> ₹${cost}`;
      });

      initMap();
    });

    async function initMap() {
      await customElements.whenDefined('gmp-map');
      const map = document.querySelector('gmp-map');
      const marker = document.querySelector('gmp-advanced-marker');
      const placePicker = document.querySelector('gmpx-place-picker');
      const infowindow = new google.maps.InfoWindow();

      map.innerMap.setOptions({ mapTypeControl: false });

      placePicker.addEventListener('gmpx-placechange', () => {
        const place = placePicker.value;
        if (!place.location) {
          alert("Please select a valid location.");
          infowindow.close();
          marker.position = null;
          return;
        }

        map.center = place.location;
        map.zoom = 17;
        marker.position = place.location;
        infowindow.setContent(`<strong>${place.displayName}</strong><br>${place.formattedAddress}`);
        infowindow.open(map.innerMap, marker);

        selectedLocation = {
          name: place.displayName,
          address: place.formattedAddress,
          lat: place.location.lat,
          lng: place.location.lng
        };

        document.getElementById("loc").innerText = `Selected: ${place.displayName}, ${place.formattedAddress}`;
      });
    }

    function confirmBooking() {
      const hrs = document.getElementById("hours").value;
      if (!selectedLocation) {
        alert("Please select a location first!");
        return;
      }

      const cost = calculateCost(hrs);
      showSection("confirmation-section");

      document.getElementById("summary").innerText = `You booked for Hours : ${hrs}.`;
      document.getElementById("amount").innerText = `Amount Want To Pay: ₹${cost}`;

      const otp = Math.floor(1000 + Math.random() * 9000);
      document.getElementById("otp").textContent = otp;

      let timeLeft = 600;
      const timerDisplay = document.getElementById("timer");

      const countdown = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        timeLeft--;

        if (timeLeft < 0) {
          clearInterval(countdown);
          timerDisplay.textContent = "EXPIRED";
          document.getElementById("otp").textContent = "----";
        }
      }, 1000);
    }
  </script>
</body>
</html>
